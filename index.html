<meta charset="utf-8">
<title>Treino CLIMB 2026</title>
<style>
  :root {
    --ground:      #E9EDEB;
    --surface:     #FAFBFA;
    --surface-2:   #F1F4F2;
    --line:        #CDD5D2;
    --line-soft:   #DDE3E1;
    --ink:         #141918;
    --ink-2:       #4C5754;
    --ink-3:       #75807D;
    --accent:      #0D6C60;
    --accent-ink:  #FFFFFF;
    --accent-soft: #D5E6E2;
    --amber:       #9C5A1E;
    --amber-soft:  #F0E2D2;
    --shadow:      0 1px 2px rgba(20,25,24,.06), 0 6px 18px -12px rgba(20,25,24,.28);
    --f-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --f-data: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0E1211; --surface:#171C1B; --surface-2:#1F2624;
      --line:#2E3735; --line-soft:#262E2C;
      --ink:#E7ECEA; --ink-2:#A6B1AE; --ink-3:#7C8785;
      --accent:#45B8A6; --accent-ink:#06201C; --accent-soft:#16332F;
      --amber:#D79355; --amber-soft:#33251A;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0E1211; --surface:#171C1B; --surface-2:#1F2624;
    --line:#2E3735; --line-soft:#262E2C;
    --ink:#E7ECEA; --ink-2:#A6B1AE; --ink-3:#7C8785;
    --accent:#45B8A6; --accent-ink:#06201C; --accent-soft:#16332F;
    --amber:#D79355; --amber-soft:#33251A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--f-ui); font-size: 16px; line-height: 1.5;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 110px; }

  .top { background: var(--ground); border-bottom: 1px solid var(--line-soft); padding: 14px 0 0; }
  .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 650; }
  .datebar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .datebar .date { font-family: var(--f-data); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .queue {
    display: flex; align-items: center; gap: 9px; margin-top: 12px;
    font-size: 11px; letter-spacing: .13em; text-transform: uppercase; font-weight: 700;
    color: var(--accent);
  }
  .queue .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .queue.viewing { color: var(--ink-3); }
  .queue.viewing .pip { background: var(--ink-3); }

  h1 { margin: 3px 0 12px; font-size: clamp(26px,7vw,34px); line-height: 1.08;
       letter-spacing: -.022em; font-weight: 800; text-wrap: balance; }
  h1 .sub { display: block; font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-top: 6px; }

  .tabs { display: flex; gap: 6px; padding-bottom: 12px; }
  .tab {
    flex: 1; min-height: 50px; position: relative;
    background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--line-soft); border-radius: 3px;
    font-family: var(--f-ui); font-size: 15px; font-weight: 750; letter-spacing: .02em;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; cursor: pointer; transition: background .12s, color .12s, border-color .12s;
  }
  .tab .d { font-size: 9.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tab[aria-selected="true"] .d { color: var(--accent-ink); opacity: .74; }
  .tab[data-next="1"]::after {
    content: ""; position: absolute; top: 5px; right: 5px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  }
  .tab[aria-selected="true"][data-next="1"]::after { background: var(--accent-ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab-cor { border-style: dashed; }
  .tab-cor[aria-selected="true"] { border-style: solid; }

  .sess { display: flex; align-items: center; gap: 10px; padding: 0 0 12px; }
  .sess.hide { display: none; }
  .sbtn { background: transparent; color: var(--ink); border: 1px solid var(--line);
          border-radius: 3px; padding: 0 14px; min-height: 44px; font: inherit;
          font-size: 13.5px; font-weight: 700; cursor: pointer; flex: none; }
  .sbtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .sbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .snum { font-family: var(--f-data); font-size: 21px; font-weight: 700;
          font-variant-numeric: tabular-nums; letter-spacing: -.02em; min-width: 76px; }
  .snum.idle { color: var(--ink-3); }
  .slbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
          color: var(--ink-3); font-weight: 650; line-height: 1.35; }

  .timer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--accent); color: var(--accent-ink);
    display: none; box-shadow: 0 -8px 22px -10px rgba(0,0,0,.5);
  }
  .timer.on { display: block; }
  .timer .inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .timer .num { font-family: var(--f-data); font-size: 30px; font-weight: 700;
                font-variant-numeric: tabular-nums; letter-spacing: -.02em; min-width: 92px; }
  .timer .lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .78; flex: 1; }
  .timer button { background: transparent; color: inherit; border: 1px solid currentColor;
                  border-radius: 3px; padding: 9px 14px; font: inherit; font-size: 13px;
                  font-weight: 650; cursor: pointer; min-height: 42px; }
  .timer.done { animation: pulse .5s ease-in-out 3; }
  @keyframes pulse { 50% { filter: brightness(1.35); } }
  @media (prefers-reduced-motion: reduce) { .timer.done { animation: none; } }

  .cue.alt { border-left: 2px solid var(--line); padding-left: 9px; opacity: .92; }

  .note { background: var(--surface-2); border: 1px solid var(--line-soft);
          border-left: 3px solid var(--ink-3); border-radius: 3px;
          padding: 11px 13px; margin-bottom: 12px; font-size: 13.5px; color: var(--ink-2); }
  .note.warn { border-left-color: var(--amber); background: var(--amber-soft); color: var(--ink); }
  .note strong { color: var(--ink); }

  details.fold { background: var(--surface); border: 1px solid var(--line-soft);
                 border-left: 3px solid var(--line); border-radius: 3px;
                 margin-bottom: 12px; box-shadow: var(--shadow); }
  details.fold[open] { border-left-color: var(--accent); }
  details.fold.risk[open] { border-left-color: var(--amber); }
  details.fold summary { list-style: none; cursor: pointer; padding: 13px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 15px; font-weight: 680; min-height: 48px; }
  details.fold summary::-webkit-details-marker { display: none; }
  details.fold summary .t { font-family: var(--f-data); font-size: 12px; color: var(--ink-3); font-weight: 500; }
  details.fold ul { margin: 0; padding: 0 14px 14px 32px; display: flex; flex-direction: column; gap: 8px; }
  details.fold li { font-size: 14px; color: var(--ink-2); line-height: 1.5; }

  details.wfold.done { border-left-color: var(--accent); }
  ul.wlist { list-style: none; padding: 0 10px 12px 10px !important; gap: 2px !important; }
  ul.wlist li { padding: 0; }
  .witem {
    width: 100%; min-height: 48px; display: flex; align-items: center; gap: 11px;
    background: transparent; border: 0; border-radius: 3px; padding: 6px 8px;
    font: inherit; font-size: 14.5px; color: var(--ink-2); text-align: left; cursor: pointer;
  }
  .witem .box {
    flex: none; width: 26px; height: 26px; border-radius: 3px;
    border: 1.5px solid var(--line); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: transparent; line-height: 1;
  }
  .witem[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .witem[aria-pressed="true"] .wn { color: var(--ink-3); text-decoration: line-through; }
  .witem .wn { flex: 1; }
  .witem .wr { font-family: var(--f-data); font-size: 12.5px; color: var(--ink-3);
               font-variant-numeric: tabular-nums; white-space: nowrap; }
  .witem:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  details.fold li b { color: var(--ink); font-family: var(--f-data); font-size: 13px; font-weight: 600; }
  details.fold.risk li b { font-family: var(--f-ui); font-size: 14px; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line-soft);
          border-left: 3px solid var(--line); border-radius: 3px;
          padding: 13px 14px 14px; box-shadow: var(--shadow); transition: border-left-color .15s; }
  .card.full { border-left-color: var(--accent); }
  .card.skipped { border-left-color: var(--amber); }
  .card.skipped .echk[aria-pressed="true"] .box { background: var(--amber); border-color: var(--amber); }
  .slabel .skip { text-transform: none; letter-spacing: 0; font-size: 11.5px;
                  font-weight: 600; color: var(--amber); }

  .chead { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 3px; }
  .idx { font-family: var(--f-data); font-size: 12px; color: var(--ink-3);
         font-variant-numeric: tabular-nums; margin-right: 7px; font-weight: 500; }
  .cname { font-size: 16px; font-weight: 680; line-height: 1.35; letter-spacing: -.008em;
           flex: 1; text-wrap: balance; padding-top: 8px; }

  .echk {
    flex: none; width: 44px; height: 44px; margin: -4px 0 0 -8px;
    background: transparent; border: 0; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .echk .box {
    width: 26px; height: 26px; border-radius: 3px;
    border: 1.5px solid var(--line); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; color: transparent;
  }
  .echk[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .echk[aria-pressed="true"] ~ .cname { color: var(--ink-3); text-decoration: line-through; }
  .echk:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: 3px; }

  .lastline {
    margin: 7px 0 0 28px; font-size: 12px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .lastline b { color: var(--ink-2); font-family: var(--f-data); font-weight: 700; }
  .sugtag {
    display: inline-block; margin-left: 4px; padding: 2px 6px; border-radius: 2px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  }
  .kg input.sug { border-color: var(--accent); color: var(--accent); }
  .tag { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
         border: 1px solid var(--accent); color: var(--accent); border-radius: 2px;
         padding: 3px 5px; white-space: nowrap; margin-top: 2px; }
  .tag.opt { border-color: var(--ink-3); color: var(--ink-3); }

  .presc { font-family: var(--f-data); font-size: 13px; color: var(--ink);
           font-variant-numeric: tabular-nums; margin: 0 0 2px 28px; }
  .cue { font-size: 13px; color: var(--ink-2); margin: 4px 0 0 28px; line-height: 1.45; }
  .cue.warn { color: var(--amber); font-weight: 550; }
  .cue.setup { color: var(--ink); }
  .cue.setup b { color: var(--accent); font-size: 11px; letter-spacing: .1em;
                 text-transform: uppercase; font-weight: 700; }
  .howto {
    display: inline-flex; align-items: center; min-height: 44px;
    margin: 2px 0 0 28px; padding: 0 2px;
    color: var(--accent); font-size: 13.5px; font-weight: 650;
    text-decoration: none; border-bottom: 1px solid transparent;
  }
  .howto:hover, .howto:focus-visible { border-bottom-color: var(--accent); }
  .howto:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  details.shot { margin: 4px 0 0 28px; }
  details.shot summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center;
    min-height: 44px; color: var(--accent); font-size: 13.5px; font-weight: 650;
    border-bottom: 1px solid transparent;
  }
  details.shot summary::-webkit-details-marker { display: none; }
  details.shot[open] summary { border-bottom-color: var(--accent); }
  details.shot summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .frames { display: flex; gap: 8px; margin: 8px 0 4px; }
  .frames figure { flex: 1; margin: 0; min-width: 0; }
  .frames img {
    display: block; width: 100%; height: auto; border-radius: 3px;
    border: 1px solid var(--line-soft); background: var(--surface-2);
  }
  .frames figcaption {
    margin-top: 4px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 650; text-align: center;
  }
  details.shot .howto { margin: 2px 0 0; min-height: 40px; font-size: 13px; }

  .circ { margin: 8px 0 0 28px; display: flex; flex-direction: column; list-style: none; padding: 0; }
  .circ li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
             border-bottom: 1px solid var(--line-soft); font-size: 14.5px; color: var(--ink); }
  .circ li:last-child { border-bottom: 0; }
  .circ .r { font-family: var(--f-data); font-size: 13px; color: var(--ink-2);
             font-variant-numeric: tabular-nums; white-space: nowrap; }

  .slabel {
    margin: 12px 0 5px 28px; font-size: 10.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 650;
  }
  .slabel b { color: var(--accent); font-family: var(--f-data); font-size: 12px;
              letter-spacing: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .slabel .hint { text-transform: none; letter-spacing: 0; font-size: 11.5px;
                  font-weight: 500; color: var(--ink-3); }
  .row { display: flex; align-items: center; gap: 8px; margin: 0 0 0 28px; flex-wrap: wrap; }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; }
  .dot { width: 44px; height: 44px; border-radius: 3px; border: 1.5px solid var(--line);
         background: var(--surface-2); color: var(--ink-3); font-family: var(--f-data);
         font-size: 13px; font-weight: 600; cursor: pointer;
         display: flex; align-items: center; justify-content: center;
         transition: background .1s, border-color .1s, color .1s; }
  .dot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .kg { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .kg input { width: 78px; min-height: 44px; text-align: right; background: var(--surface-2);
              border: 1.5px solid var(--line); border-radius: 3px; color: var(--ink);
              font-family: var(--f-data); font-size: 15px; font-weight: 600;
              font-variant-numeric: tabular-nums; padding: 0 8px; }
  .kg input::placeholder { color: var(--ink-3); font-weight: 400; }
  .kg input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .kg span { font-family: var(--f-data); font-size: 12px; color: var(--ink-3); }

  .rest { display: flex; gap: 7px; margin: 16px 0 4px; }
  .rest button { flex: 1; min-height: 46px; background: var(--surface);
                 border: 1px solid var(--line); border-radius: 3px; color: var(--ink-2);
                 font-family: var(--f-data); font-size: 14px; font-weight: 600; cursor: pointer; }
  .rest button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .advance { margin-top: 18px; }
  .advance .btn { width: 100%; }

  .foot { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line-soft); }
  h2 { font-size: 13px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3);
       font-weight: 700; margin: 0 0 10px; }
  textarea { width: 100%; min-height: 140px; resize: vertical; background: var(--surface);
             border: 1px solid var(--line); border-radius: 3px; color: var(--ink);
             font-family: var(--f-data); font-size: 13px; line-height: 1.65; padding: 12px;
             font-variant-numeric: tabular-nums; }
  textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn { flex: 1; min-height: 48px; min-width: 130px; background: var(--accent);
         color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 3px;
         font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line); font-weight: 600; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fine { font-size: 12.5px; color: var(--ink-3); margin-top: 14px; line-height: 1.55; }
  .fine.credit { margin-top: 8px; font-size: 11.5px; }
  .fine.credit a { color: var(--ink-2); }
</style>

<div class="wrap">
  <div class="top">
    <div class="datebar">
      <span class="eyebrow" id="block">Bloco · ago→out</span>
      <span class="date" id="date"></span>
    </div>
    <div class="queue" id="qline"><span class="pip"></span><span id="qtext">Próxima na fila</span></div>
    <h1 id="title">Sessão A<span class="sub" id="subtitle">Puxar</span></h1>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="sess" id="sess">
      <button type="button" class="sbtn" id="sbtn">Iniciar treino</button>
      <span class="snum idle" id="snum" role="timer" aria-live="off">0:00</span>
      <span class="slbl" id="slbl">cronômetro da sessão</span>
    </div>
  </div>

  <div class="timer" id="timer" role="status" aria-live="polite">
    <div class="inner">
      <span class="num" id="tnum">0:00</span>
      <span class="lbl" id="tlbl">descanso</span>
      <button type="button" id="tstop">Parar</button>
    </div>
  </div>

  <main id="main"></main>

  <div class="rest">
    <button type="button" data-s="60">60s</button>
    <button type="button" data-s="90">90s</button>
    <button type="button" data-s="120">2 min</button>
    <button type="button" data-s="180">3 min</button>
  </div>

  <div class="advance">
    <button type="button" class="btn" id="adv">Concluí — avançar a fila</button>
  </div>

  <div class="foot">
    <h2>Registro pro diário</h2>

      domínio público (The Unlicense).
    </p>
  </div>
</div>

<script src="academia-log.js"></script>
<script>
"use strict";

/* Base comum a toda sessão + um bloco específico por tipo de sessão — 23/08:
   a B é dia de perna e vinha recebendo o mesmo aquecimento de ombro da A/C.
   Ativa o que a sessão do dia vai cobrar, não o genérico de sempre. */
const WARMUP_BASE = [
  ["Esteira / bike / elíptico leve", "3 min"],
  ["Gato-camelo + rotação torácica", "10 + 8 cada lado"]
];
const WARMUP_BY = {
  A: [ ["Rotação externa de ombro c/ banda", "2×15 cada"],
       ["Band pull-apart", "2×15"],
       ["Círculo de punho + alongar antebraço", "30s cada"] ],
  C: [ ["Rotação externa de ombro c/ banda", "2×15 cada"],
       ["Band pull-apart", "2×15"],
       ["Círculo de punho + alongar antebraço", "30s cada"] ],
  B: [ ["Agachamento livre, sem peso", "10"],
       ["Ponte de glúteo — ativação", "15"],
       ["Círculo de tornozelo", "10 cada lado"] ]
};
function warmupFor(s) { return WARMUP_BASE.concat(WARMUP_BY[s] || []); }

const RISCO = [
  "<b>Escalou num dia livre? Escala bem abaixo do limite.</b> Volume e técnica. O corpo vai dizer que aguenta um grau acima — a polia não tem opinião até romper.",
  "<b>Nada de hangboard neste bloco.</b> A Fase 0 continua valendo pro dedo, mesmo com o resto do corpo em outro patamar.",
  "<b>Farmer's walk e pendura em barra grossa, mão aberta</b> — é o quanto de dedo este bloco carrega, e é de propósito.",
  "<b>Em outubro você volta forte e com dedo destreinado.</b> É o cenário clássico de lesão de escalador voltando. A rampa se planeja lá."

/* D saiu da fila em 20/08 — dissolvida em finishers dentro de A/B/C (ver plano-academia.md).
   Se alguém tiver "climb::fila" salvo apontando pro índice 3 (D), o guard abaixo
   (qi >= 0 && qi < ORDER.length) já invalida e volta pra A sozinho. */
const ORDER = ["A", "B", "C"];
const now = new Date();
const pad = n => String(n).padStart(2, "0");
const iso = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

const mem = {};
let STORAGE_OK = true;
try { localStorage.setItem("climb::t", "1"); localStorage.removeItem("climb::t"); }
catch (e) { STORAGE_OK = false; }

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
};

/* fila: persiste entre dias */
let qi = parseInt(store.get("climb::fila") || "0", 10);
if (!(qi >= 0 && qi < ORDER.length)) qi = 0;

let current = ORDER[qi];
const key = s => `climb::v2::${iso}::${s}`;
const load = s => { try { return JSON.parse(store.get(key(s)) || "{}"); } catch (e) { return {}; } };
const save = (s, st) => store.set(key(s), JSON.stringify(st));
let state = load(current);

/* bloco 1 até 06/09, bloco 2 a partir de 07/09 */
const BLOCO2 = new Date(2026, 8, 7);
const isB2 = now >= BLOCO2;
document.getElementById("block").textContent =
  isB2 ? "Bloco 2 · até 04/10" : "Bloco 1 · até 06/09";

const DIAS = ["dom","seg","ter","qua","qui","sex","sáb"];

  `${DIAS[now.getDay()]} ${pad(now.getDate())}/${pad(now.getMonth() + 1)}`;

let qcor = parseInt(store.get("climb::cor") || "0", 10);
if (!(qcor >= 0 && qcor <= COR.steps.length)) qcor = 0;

/* ---- histórico de carga: sobrevive entre sessões ---- */
let HIST = {};
try { HIST = JSON.parse(store.get("climb::hist") || "{}"); } catch (e) { HIST = {}; }

/* Migração 18/08: a carga era guardada pela POSIÇÃO do exercício na lista. A poda mudou as
   posições — sem converter, o app mostraria a carga de um exercício no campo de outro.
   Os que saíram da lista não migram: o número deles está no diario-de-treino, datado. */
const LEGACY = {
  "A::0":"barra-fixa", "A::2":"remada-curvada", "A::4":"face-pull",
  "A::6":"rosca-martelo", "A::7":"farmers-walk", "A::8":"elev-pernas",
  "B::0":"agachamento", "B::1":"rdl", "B::2":"step-up",
  "B::5":"panturrilha", "B::6":"prancha-lateral",
  "C::0":"supino-reto", "C::1":"desenvolvimento", "C::3":"dips",
  "C::4":"elev-lateral", "C::5":"rot-externa", "C::7":"pallof", "C::8":"antebraco",
  "D::0":"circuito", "D::1":"farmers-walk-d", "D::2":"cardio", "D::3":"mobilidade"
};
if (store.get("climb::histv") !== "2") {
  const conv = {};
  Object.keys(HIST).forEach(k => {
    const id = LEGACY[k];
    if (id) conv[k.slice(0, 1) + "::" + id] = HIST[k];
  });
  HIST = conv;
  store.set("climb::hist", JSON.stringify(HIST));
  store.set("climb::histv", "2");
}

/* PREV é congelado no carregamento: a referência exibida nunca muda por causa
   do que eu gravar hoje. Sem isso, a primeira renderização apaga a própria
   referência que ela deveria mostrar. */
const PREV = JSON.parse(JSON.stringify(HIST));

const hkey = (s, i) => `${s}::${i}`;

function noteHist(s, i, kg, n, total) {
  if (!kg && !n) return;
  HIST[hkey(s, i)] = { kg: kg || "", d: iso, n, t: total };
  store.set("climb::hist", JSON.stringify(HIST));
}

/* sugestão: fechou todas as séries → sobe um degrau; senão, repete */
function suggest(h, blk) {
  const v = parseFloat(String(h.kg).replace(",", "."));
  if (!isFinite(v)) return { kg: h.kg, why: "repetir" };
  if (h.n >= h.t) {
    const step = blk.step || 2.5;
    return { kg: String(+(v + step).toFixed(2)).replace(".", ","), why: `+${String(step).replace(".", ",")}` };
  }
  return { kg: h.kg, why: "repetir" };
}

      if (!STORAGE_OK) qi = ORDER.indexOf(k);   // sem memória, a aba É a fila

/* ---- cronômetro da sessão ----
   Manual de propósito: começa quando você aperta e para quando você aperta. O único
   automatismo é encerrar sozinho ao avançar a fila, pra não ficar cronômetro fantasma
   contando a noite inteira. Os dois horários ficam salvos com a sessão do dia. */
const sBar = document.getElementById("sess");
const sBtn = document.getElementById("sbtn");
const sNum = document.getElementById("snum");
const sLbl = document.getElementById("slbl");
let sId = null;

const hm = ts => { const d = new Date(ts); return `${d.getHours()}:${pad(d.getMinutes())}`; };
const dur = ms => {
  const t = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
};
const mins = ms => Math.max(1, Math.round(ms / 60000));

/* o cronômetro pertence à SESSÃO, não ao dia: o tempo que vai pro registro é o tempo
   daquele treino. Se você espiar outra aba com um treino rodando, o aviso continua à vista. */
function runningElsewhere() {
  for (const k of ORDER) {
    if (k === current) continue;
    const st = load(k);
    if (st.t0 && !st.t1) return { s: k, t0: st.t0 };
  }
  return null;
}

function paintSess() {
  if (current === "COR") { sBar.classList.add("hide"); return; }
  sBar.classList.remove("hide");
  if (!state.t0) {
    const other = runningElsewhere();
    sBtn.textContent = "Iniciar treino"; sBtn.classList.remove("on");
    sNum.textContent = "0:00"; sNum.classList.add("idle");
    if (other) sLbl.innerHTML = `<b>${SESSIONS[other.s].name}</b> rodando · ${dur(Date.now() - other.t0)}`;
    else sLbl.textContent = "cronômetro da sessão";
  } else if (!state.t1) {
    sBtn.textContent = "Encerrar"; sBtn.classList.add("on");
    sNum.textContent = dur(Date.now() - state.t0); sNum.classList.remove("idle");
    sLbl.textContent = `em treino desde ${hm(state.t0)}`;
  } else {
    sBtn.textContent = "Retomar"; sBtn.classList.remove("on");
    sNum.textContent = dur(state.t1 - state.t0); sNum.classList.remove("idle");
    sLbl.innerHTML = `${hm(state.t0)} → ${hm(state.t1)} · <b>${mins(state.t1 - state.t0)} min</b>`;
  }
}
function tickSess() {
  if (sId) { clearInterval(sId); sId = null; }
  if (current === "COR") return;
  if ((state.t0 && !state.t1) || runningElsewhere()) sId = setInterval(paintSess, 1000);
}
function endSess() {
  if (current !== "COR" && state.t0 && !state.t1) { state.t1 = Date.now(); save(current, state); }
}
sBtn.addEventListener("click", () => {
  if (current === "COR") return;
  if (!state.t0) state.t0 = Date.now();
  else if (!state.t1) state.t1 = Date.now();
  else state.t1 = null;              // encerrou sem querer, ou o treino continuou
  save(current, state); paintSess(); tickSess(); buildLog();
});

/* ---- timer ---- */
const tEl = document.getElementById("timer");
const tNum = document.getElementById("tnum");
const tLbl = document.getElementById("tlbl");
let tId = null, tLeft = 0;
const paint = () => { tNum.textContent = `${Math.floor(tLeft / 60)}:${pad(tLeft % 60)}`; };

function startTimer(sec, label) {
  stopTimer();
  if (!sec) return;
  tLeft = sec; tLbl.textContent = label || "descanso";
  tEl.classList.add("on"); tEl.classList.remove("done");
  paint();
  tId = setInterval(() => {
    tLeft--;
    if (tLeft <= 0) {
      paint(); clearInterval(tId); tId = null;
      tLbl.textContent = "acabou"; tEl.classList.add("done");
      try { navigator.vibrate && navigator.vibrate([180, 90, 180]); } catch (e) {}
      setTimeout(() => { if (!tId) tEl.classList.remove("on", "done"); }, 6000);
      return;
    }
    paint();
  }, 1000);
}
function stopTimer() {
  if (tId) { clearInterval(tId); tId = null; }
  tEl.classList.remove("on", "done");
}
document.getElementById("tstop").addEventListener("click", stopTimer);
document.querySelectorAll(".rest button").forEach(b =>
  b.addEventListener("click", () => startTimer(+b.dataset.s)));

/* ---- render ---- */
const main = document.getElementById("main");

function markTabs() {
  [...tabsEl.children].forEach(b => {
    b.setAttribute("aria-selected", b.dataset.k === current ? "true" : "false");
    b.dataset.next = (b.dataset.k === "COR")
      ? (qcor < COR.steps.length ? "1" : "0")
      : (b.dataset.k === ORDER[qi] ? "1" : "0");
  });
}

function renderCor() {
  document.getElementById("title").firstChild.textContent = COR.name;
  document.getElementById("subtitle").textContent = COR.sub;

  const done = qcor >= COR.steps.length;
  const ql = document.getElementById("qline");
  ql.classList.remove("viewing");
  document.getElementById("qtext").textContent = done
    ? "Peça fechada — todos os passos"
    : `Próximo passo · ${qcor + 1} de ${COR.steps.length}`;
  markTabs();
  paintSess(); tickSess();

  main.textContent = "";

  const n1 = document.createElement("p");
  n1.className = "note"; n1.innerHTML = COR.note;
  main.appendChild(n1);

  const n2 = document.createElement("p");
  n2.className = "note warn"; n2.innerHTML = COR.min;
  main.appendChild(n2);

  const list = document.createElement("div");
  list.className = "list";
  main.appendChild(list);

  COR.steps.forEach((st, i) => {
    const card = document.createElement("div");
    card.className = "card" + (i < qcor ? " full" : "");
    if (i > qcor) card.style.opacity = ".55";

    const head = document.createElement("div");
    head.className = "chead";
    head.innerHTML = `<span class="idx">${pad(i + 1)}</span><span class="cname">${st.n}</span>` +
      (i === qcor ? `<span class="tag">agora</span>` : "") +
      (i < qcor ? `<span class="tag opt">feito</span>` : "");
    card.appendChild(head);

    const p = document.createElement("p");
    p.className = "presc"; p.textContent = st.t;
    card.appendChild(p);

    const d = document.createElement("p");
    d.className = "cue"; d.innerHTML = st.d;
    card.appendChild(d);

    list.appendChild(card);
  });

  const adv = document.getElementById("adv");
  adv.textContent = done ? "Recomeçar a fila do ofício" : "Fiz esse — próximo passo";

  document.getElementById("fine").innerHTML =
    "O passo cumprido vira uma linha factual na daily (<b>bloco: ofício</b>) e o marco datado vai pra <b>🎨 Trilha — Cor</b>. Sem adjetivo e sem nota.";

  logEl.value = done
    ? "Peça de cor — todos os passos concluídos"
    : `Ofício/cor — ${pad(now.getDate())}/${pad(now.getMonth() + 1)}\nPasso ${qcor + 1}/${COR.steps.length}: ${COR.steps[qcor].n}`;
}

function buildWarmup() {
  const warm = document.createElement("details");
  warm.className = "fold wfold";
  const items = warmupFor(current);

  const sum = document.createElement("summary");
  const ttl = document.createElement("span"); ttl.textContent = "Aquecimento";
  const cnt = document.createElement("span"); cnt.className = "t";
  sum.appendChild(ttl); sum.appendChild(cnt);

  const ul = document.createElement("ul"); ul.className = "wlist";
  const get = () => (state.warm || (state.warm = []));

  const paint = () => {
    const n = get().length, total = items.length;
    cnt.textContent = `${n} de ${total} · ~7 min`;
    warm.classList.toggle("done", n >= total);
  };

  items.forEach(([nm, r], i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.className = "witem";
    b.setAttribute("aria-pressed", get().includes(i) ? "true" : "false");
    b.innerHTML = `<span class="box" aria-hidden="true">✓</span>` +
                  `<span class="wn">${nm}</span><span class="wr">${r}</span>`;
    b.addEventListener("click", () => {
      const w = get(), at = w.indexOf(i);
      if (at > -1) w.splice(at, 1); else w.push(i);
      b.setAttribute("aria-pressed", at > -1 ? "false" : "true");
      save(current, state); paint(); buildLog();
    });
    li.appendChild(b); ul.appendChild(li);
  });

  warm.appendChild(sum); warm.appendChild(ul);
  paint();
  return warm;
}

function render() {
  if (current === "COR") return renderCor();
  const S = SESSIONS[current];
  document.getElementById("title").firstChild.textContent = S.name;
  document.getElementById("subtitle").textContent = S.sub;

  const isNext = current === ORDER[qi];
  const ql = document.getElementById("qline");
  ql.classList.toggle("viewing", !isNext);
  document.getElementById("qtext").textContent =
    !STORAGE_OK ? "Este navegador não guarda a fila — escolha a sessão na aba"
    : isNext ? "Próxima na fila"
    : `Só vendo · a próxima é a ${SESSIONS[ORDER[qi]].name}`;

  markTabs();
  paintSess(); tickSess();

  main.textContent = "";

  main.appendChild(buildWarmup());

  const n1 = document.createElement("p");
  n1.className = "note"; n1.innerHTML = S.note;
  main.appendChild(n1);

  const n2 = document.createElement("p");
  n2.className = "note warn";
  n2.innerHTML = isB2
    ? "<strong>Bloco 2:</strong> os dois primeiros descem pra <strong>5-8 reps</strong> com mais carga. Acessórios ficam 8-12."
    : "<strong>Bloco 1:</strong> topo da faixa, <strong>2-3 reps na reserva</strong>. O trabalho é achar a carga e anotar, não bater recorde.";
  main.appendChild(n2);

  const n3 = document.createElement("p");
  n3.className = "note";
  n3.innerHTML = "<strong>Seis exercícios, ~45 min.</strong> Quer botar um? Tira outro — a lista não cresce. O que saiu da poda de 18/08 virou <strong>troca</strong> dentro do próprio card.<br>" +
    "Aquecimento + os <strong>2 primeiros</strong> = <strong>Sessão Mínima Viável</strong>. A fila anda igual — o mínimo não é dívida.<br>" +
    "A caixa <strong>encerra</strong> o exercício e te tira dele; quem registra o que foi feito são as <strong>séries</strong>. Encerrar sem série marcada vira <strong>não feito</strong>, e isso é registro legítimo.";
  main.appendChild(n3);

  const risk = document.createElement("details");
  risk.className = "fold risk";
  risk.innerHTML = `<summary>⚠ O risco deste bloco <span class="t">dedo x puxada</span></summary><ul>` +
    RISCO.map(r => `<li>${r}</li>`).join("") + `</ul>`;
  main.appendChild(risk);

  const list = document.createElement("div");
  list.className = "list";
  main.appendChild(list);

  S.blocks.forEach((blk, bi) => {
    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "chead";

    const chk = document.createElement("button");
    chk.type = "button"; chk.className = "echk";
    chk.innerHTML = `<span class="box" aria-hidden="true">✓</span>`;
    chk.setAttribute("aria-label", `Encerrar "${blk.name}" e seguir`);
    head.appendChild(chk);

    const nm = document.createElement("span");
    nm.className = "cname";
    nm.innerHTML = `<span class="idx">${pad(bi + 1)}</span>${blk.name}`;
    head.appendChild(nm);

    if (blk.min) head.insertAdjacentHTML("beforeend", `<span class="tag">mínimo</span>`);
    if (blk.opt) head.insertAdjacentHTML("beforeend", `<span class="tag opt">opcional</span>`);
    if (blk.fin) head.insertAdjacentHTML("beforeend", `<span class="tag opt">finisher${blk.finT ? " · " + blk.finT : ""}</span>`);
    card.appendChild(head);

    const p = document.createElement("p");
    p.className = "presc"; p.textContent = (isB2 && blk.presc2) ? blk.presc2 : blk.presc;
    card.appendChild(p);

    if (blk.kind === "circuit") {
      const ul = document.createElement("ul");
      ul.className = "circ";
      ul.innerHTML = blk.items.map(([n, r]) => `<li><span>${n}</span><span class="r">${r}</span></li>`).join("");
      card.appendChild(ul);
    }
    if (blk.setup) {
      const s = document.createElement("p"); s.className = "cue setup";
      s.innerHTML = "<b>Como é:</b> " + blk.setup; card.appendChild(s);
    }
    if (blk.cue) {
      const c = document.createElement("p"); c.className = "cue"; c.innerHTML = blk.cue; card.appendChild(c);
    }
    if (blk.alt) {
      const a = document.createElement("p"); a.className = "cue alt";
      a.innerHTML = "<b>Troca:</b> " + blk.alt; card.appendChild(a);
    }
    if (blk.kind !== "circuit") {
      const q = blk.q || blk.name.replace(/\s*[\(—].*$/, "").trim();

      if (blk.img) {
        const det = document.createElement("details");
        det.className = "shot";
        det.innerHTML =
          `<summary>▣ ver execução</summary>` +
          `<div class="frames">` +
          `<figure><img loading="lazy" decoding="async" src="img/${blk.img}-0.jpg" alt="${blk.name} — posição inicial"><figcaption>início</figcaption></figure>` +
          `<figure><img loading="lazy" decoding="async" src="img/${blk.img}-1.jpg" alt="${blk.name} — posição final"><figcaption>fim</figcaption></figure>` +
          `</div>` +
          `<a class="howto" target="_blank" rel="noopener noreferrer" ` +
          `href="https://www.youtube.com/results?search_query=${encodeURIComponent(q + " execução correta")}">▶ ver em vídeo</a>`;
        card.appendChild(det);
      } else {
        const a = document.createElement("a");
        a.className = "howto";
        a.href = "https://www.youtube.com/results?search_query=" +
                 encodeURIComponent(q + " execução correta");
        a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = "▶ ver execução em vídeo";
        a.setAttribute("aria-label", `Ver vídeo de execução — ${q}`);
        card.appendChild(a);
      }
    }

    const slab = document.createElement("p");
    slab.className = "slabel";
    card.appendChild(slab);

    const row = document.createElement("div");
    row.className = "row";
    const dots = document.createElement("div");
    dots.className = "dots";
    const dotEls = [];
    const unitName = blk.unit ? "voltas" : "séries";
    const st0 = () => state[blk.id] || (state[blk.id] = { d: [], kg: "" });

    /* fromUser: só o toque do usuário grava histórico. Renderização não grava. */
    /* O checkbox ENCERRA o exercício — não afirma que foi feito.
       Quem registra o que foi feito são as séries. Encerrado com 0 séries = não fiz. */
    const sync = (fromUser) => {
      const st = st0(), n = st.d.length, todas = n >= blk.sets, pulou = !!st.done && n === 0;
      dotEls.forEach((d, i) => d.setAttribute("aria-pressed", st.d.includes(i) ? "true" : "false"));
      slab.innerHTML = `${unitName} <b>${n} de ${blk.sets}</b>` +
        (pulou ? ` <span class="skip">— encerrado sem fazer</span>`
               : (n === 0 ? ` <span class="hint">— toca uma a cada ${blk.unit || "série"} feita</span>` : ""));
      card.classList.toggle("full", (!!st.done || todas) && !pulou);
      card.classList.toggle("skipped", pulou);
      chk.setAttribute("aria-pressed", st.done ? "true" : "false");
      if (fromUser) noteHist(current, blk.id, st.kg, n, blk.sets);
      save(current, state); buildLog();
    };

    chk.addEventListener("click", () => {
      const st = st0();
      st.done = !st.done;
      stopTimer();
      sync(true);
    });

    for (let i = 0; i < blk.sets; i++) {
      const d = document.createElement("button");
      d.type = "button"; d.className = "dot";
      d.textContent = blk.sets === 1 ? "✓" : String(i + 1);
      d.setAttribute("aria-label", `${blk.unit || "série"} ${i + 1} de ${blk.sets} — ${blk.name}`);
      d.addEventListener("click", () => {
        const st = st0(), at = st.d.indexOf(i);
        if (at > -1) st.d.splice(at, 1); else st.d.push(i);
        sync(true);
        if (at === -1 && i < blk.sets - 1) {
          startTimer(blk.rest, blk.unit ? "entre voltas" : "descanso");
        }
      });
      dotEls.push(d); dots.appendChild(d);
    }
    row.appendChild(dots);

    const h = PREV[hkey(current, blk.id)];
    const isOld = h && h.d !== iso;

    if (blk.kg) {
      const kg = document.createElement("div");
      kg.className = "kg";
      const inp = document.createElement("input");
      inp.type = "text"; inp.inputMode = "decimal"; inp.placeholder = "—";
      inp.setAttribute("aria-label", `Peso — ${blk.name}`);

      let sug = null;
      if (state[blk.id]?.kg) {
        inp.value = state[blk.id].kg;
      } else if (isOld && h.kg) {
        sug = suggest(h, blk);
        inp.value = sug.kg;
        inp.classList.add("sug");
        st0().kg = sug.kg;
      }

      inp.addEventListener("input", () => {
        inp.classList.remove("sug");
        const st = st0();
        st.kg = inp.value;
        noteHist(current, blk.id, st.kg, st.d.length, blk.sets);
        save(current, state); buildLog();
      });
      inp.addEventListener("focus", () => inp.select());

      kg.appendChild(inp);
      const u = document.createElement("span"); u.textContent = blk.kgLabel || "kg";
      kg.appendChild(u);
      row.appendChild(kg);
      card.appendChild(row);

      if (isOld) {
        const ref = document.createElement("p");
        ref.className = "lastline";
        const carga = h.kg ? `<b>${h.kg}</b> ${blk.kgLabel || "kg"}` : "sem carga";
        const partes = [`última <b>${brDate(h.d)}</b>`, carga, `${h.n} de ${h.t} ${unitName}`];
        ref.innerHTML = partes.join(" · ") +
          (sug ? ` <span class="sugtag">${sug.why === "repetir" ? "sugerido: repetir" : "sugerido " + sug.why}</span>` : "");
        card.appendChild(ref);
      }
    } else {
      card.appendChild(row);
      if (isOld) {
        const ref = document.createElement("p");
        ref.className = "lastline";
        ref.innerHTML = `última <b>${brDate(h.d)}</b> · ${h.n} de ${h.t} ${unitName}`;
        card.appendChild(ref);
      }
    }

    sync();
    list.appendChild(card);
  });

  const adv = document.getElementById("adv");
  adv.textContent = (isNext || !STORAGE_OK)
    ? `Concluí — ir pra ${SESSIONS[ORDER[(qi + 1) % ORDER.length]].name}`
    : `Voltar pra fila (${SESSIONS[ORDER[qi]].name})`;

  document.getElementById("fine").innerHTML = STORAGE_OK
    ? "Só fato: tempo, exercício, peso, séries&nbsp;×&nbsp;reps. Ao concluir, o iPhone abre o Obsidian por alguns segundos e grava o registro como <b>pendente</b> na entrada de treinos. A fila e a sessão em andamento também ficam salvas neste aparelho."
    : "Só fato: exercício, peso, séries&nbsp;×&nbsp;reps — cola no <b>diario-de-treino</b> e marca <b>bloco: corpo</b> na daily. <b>Atenção:</b> este navegador não está guardando nada — copie o registro antes de fechar a página.";

  buildLog();
}

/* ---- fila ---- */
document.getElementById("adv").addEventListener("click", () => {
  if (current === "COR") {
    qcor = qcor >= COR.steps.length ? 0 : qcor + 1;
    store.set("climb::cor", String(qcor));
    window.scrollTo(0, 0);
    render();
    return;
  }
  endSess();
  buildLog();
  const completedSession = current;
  const completedState = state;
  const completedLog = logEl.value;
  const startedAt = completedState.t0 || Date.now();
  const completedAt = new Date(completedState.t1 || Date.now()).toISOString();
  const inboxId = AcademiaLog.workoutId({ session: completedSession, startedAt });
  const inboxEntry = AcademiaLog.buildInboxEntry({ id: inboxId, completedAt, log: completedLog });
  const returnUrl = window.location.protocol === "http:" || window.location.protocol === "https:"
    ? window.location.href.split("#")[0]
    : "";
  const inboxUri = AcademiaLog.buildObsidianAppendUri({
    vault: "OBSIDIAN",
    file: "🧠 Fellipe Brain/02 Áreas/CLIMB/treino/entrada-de-treinos.md",
    content: inboxEntry,
    returnUrl,
  });
  if (current === ORDER[qi]) {
    qi = (qi + 1) % ORDER.length;
    store.set("climb::fila", String(qi));
  }
  current = ORDER[qi];
  state = load(current);
  stopTimer();
  window.scrollTo(0, 0);
  render();
  window.location.href = inboxUri;
});

/* ---- log ---- */
const logEl = document.getElementById("log");
function buildLog() {
  const S = SESSIONS[current];
  const lines = [`${S.name} (${S.tag}) — ${pad(now.getDate())}/${pad(now.getMonth() + 1)}`];
  if (state.t0 && state.t1) {
    lines.push(`Treino ${hm(state.t0)} → ${hm(state.t1)} · ${mins(state.t1 - state.t0)} min`);
  } else if (state.t0) {
    lines.push(`Treino iniciado ${hm(state.t0)} — em andamento`);
  }
  const head = lines.length;
  const w = (state.warm || []).length;
  if (w) lines.push(`Aquecimento — ${w}/${warmupFor(current).length}`);
  S.blocks.forEach((blk, bi) => {
    const st = state[blk.id];
    if (!st) return;
    const n = st.d ? st.d.length : 0;
    if (!n) {
      if (st.done) lines.push(`${blk.name} — NÃO FEITO`);
      return;
    }
    const kg = st.kg ? ` ${st.kg}kg` : "";
    const unit = blk.unit ? ` volta${n > 1 ? "s" : ""}` : "";
    lines.push(`${blk.name}${kg} — ${n}/${blk.sets}${unit}`);
  });
  if (lines.length === head) lines.push("(marque as séries pra montar o registro)");
  logEl.value = lines.join("\n");
}

document.getElementById("copy").addEventListener("click", async () => {
  const b = document.getElementById("copy");
  logEl.focus(); logEl.select();
  let ok = false;
  try { await navigator.clipboard.writeText(logEl.value); ok = true; }
  catch (e) { try { ok = document.execCommand("copy"); } catch (e2) { ok = false; } }
  b.textContent = ok ? "Copiado" : "Selecionado — copie";
  setTimeout(() => { b.textContent = "Copiar registro"; }, 2200);
});

document.getElementById("reset").addEventListener("click", () => {
  state = {}; save(current, state); stopTimer(); render();
});

render();
</script>
